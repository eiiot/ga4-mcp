app = "tuft-ga4-mcp"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  GA4_MCP_SERVER_URL = "https://ga4.mcp.tuft.dev"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
